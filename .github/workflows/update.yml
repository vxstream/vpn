name: Update Ascome VPN

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

# Добавили права на запись для GitHub Actions
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: pip install httpx pyyaml requests

      - name: Cache xray
        id: cache-xray
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/xray
          key: xray-v1.8.25

      - name: Install xray (if not cached)
        if: steps.cache-xray.outputs.cache-hit != 'true'
        run: |
          curl -LO https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          sudo apt-get install -y unzip
          unzip -o Xray-linux-64.zip -d /tmp/xray
          sudo mv /tmp/xray/xray /usr/local/bin/xray
          chmod +x /usr/local/bin/xray
          rm -rf Xray-linux-64.zip /tmp/xray

      - name: Собрать подписки
        run: python t.py

      - name: Проверить и построить JSON
        run: python check.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/all_vless.txt runvpn.txt legion_clash.yaml runvpn.json
          git diff --cached --quiet || git commit -m "♻️ Update configs $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Отправить в Cloudflare
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "X-Admin-Key: ${{ secrets.ADMIN_KEY }}" \
            -H "Content-Type: application/json" \
            --data-binary @runvpn.json \
            ${{ secrets.WORKER_URL }}/admin/update)
          echo "Статус CF: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Лог
        run: cat check_log.txt
